<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap - Creator Gig Marketplace</title>
  <style>
    /* Premium Modern Dark Theme Variables */
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(22, 31, 48, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --glass-bg: rgba(15, 23, 42, 0.85);
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 14px 24px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-logo {
      height: 48px; /* Set height for custom logo image */
      width: auto;
      object-fit: contain;
    }

    .logo-fallback {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    nav button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      margin-left: 6px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    nav button:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    nav button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      padding: 40px 20px 30px;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin: 0 0 10px 0;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin: 0 auto;
      max-width: 600px;
    }

    /* Layout & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .category-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .price {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 15px 0 5px;
    }

    /* Buttons & Inputs */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-danger { 
      background: var(--danger); 
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }
    
    .btn-success { 
      background: var(--success); 
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0 18px 0;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Status Tags */
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .status-Pending { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid rgba(217, 119, 6, 0.4); }
    .status-Accepted { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-Declined { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <!-- If you have an image logo file, uncomment below and change logo.png to your image file -->
        <!-- <img src="logo.png" alt="SkillSwap Logo" class="site-logo" /> -->
        <h1 class="logo-fallback">⚡ SkillSwap</h1>
      </div>
      <nav>
        <button onclick="switchView('marketplace')" id="nav-marketplace" class="active">Marketplace</button>
        <button onclick="switchView('post-gig')" id="nav-post-gig">Post a Gig</button>
        <button onclick="switchView('creator-dashboard')" id="nav-creator-dashboard">Creator Dashboard</button>
        <button onclick="switchView('my-bookings')" id="nav-my-bookings">My Bookings</button>
      </nav>
    </header>

    <!-- 1. BROWSE & SEARCH VIEW -->
    <section id="marketplace" class="view active">
      <div class="hero">
        <h2>Monetize & Book Creator Gigs</h2>
        <p>Connect with high-tier creators for custom video edits, thumbnails, scripts, and AI workflows.</p>
      </div>
      <input type="text" id="search-input" placeholder="🔍 Search gigs by title, skill, or category..." onkeyup="renderGigs()" />
      <div id="gig-list" class="grid"></div>
    </section>

    <!-- 2. POST A GIG VIEW -->
    <section id="post-gig" class="view">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>Publish a Service</h2>
        <form id="gig-form" onsubmit="handlePostGig(event)">
          <label>Gig Title</label>
          <input type="text" id="gig-title" required placeholder="e.g., Cinematic Reel Editing" />

          <label>Category</label>
          <select id="gig-category">
            <option value="Design">Design</option>
            <option value="Video Editing">Video Editing</option>
            <option value="AI Video">AI Video</option>
            <option value="Scriptwriting">Scriptwriting</option>
            <option value="Voiceover">Voiceover</option>
          </select>

          <label>Rate (₹)</label>
          <input type="number" id="gig-rate" required placeholder="1500" min="1" />

          <label>Description</label>
          <textarea id="gig-desc" rows="4" required placeholder="Detail your deliverables, turnaround time, and requirements..."></textarea>

          <button type="submit" class="btn">Publish Gig</button>
        </form>
      </div>
    </section>

    <!-- 3. CREATOR DASHBOARD VIEW -->
    <section id="creator-dashboard" class="view">
      <h2>Creator Dashboard</h2>
      <p style="color: var(--text-muted);">Manage incoming booking requests from clients.</p>
      <div id="incoming-requests" class="grid"></div>
    </section>

    <!-- 4. CLIENT BOOKINGS VIEW -->
    <section id="my-bookings" class="view">
      <h2>My Bookings</h2>
      <p style="color: var(--text-muted);">Track real-time status updates on services you've ordered.</p>
      <div id="client-bookings" class="grid"></div>
    </section>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRupees(amount) {
      return '₹' + Number(amount).toLocaleString('en-IN');
    }

    let gigs = JSON.parse(localStorage.getItem('sw_gigs')) || [
      { id: 1, title: 'YouTube Thumbnail Design', category: 'Design', rate: 500, desc: 'High-CTR custom thumbnail delivered in 24 hours.' },
      { id: 2, title: 'Shorts & Reels Editing', category: 'Video Editing', rate: 2000, desc: 'Engaging captions, fast cuts, and sound effects.' },
      { id: 3, title: 'AI Avatar Video Creation', category: 'AI Video', rate: 1500, desc: 'Realistic AI video generation with custom voiceovers.' }
    ];

    let bookings = JSON.parse(localStorage.getItem('sw_bookings')) || [];

    function saveData() {
      localStorage.setItem('sw_gigs', JSON.stringify(gigs));
      localStorage.setItem('sw_bookings', JSON.stringify(bookings));
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      document.getElementById(viewId).classList.add('active');
      document.getElementById(`nav-${viewId}`).classList.add('active');

      renderGigs();
      renderCreatorDashboard();
      renderClientBookings();
    }

    function renderGigs() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const list = document.getElementById('gig-list');
      list.innerHTML = '';

      const filtered = gigs.filter(g => 
        g.title.toLowerCase().includes(query) || g.category.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted);">No services matching your search criteria.</p>';
        return;
      }

      filtered.forEach(gig => {
        list.innerHTML += `
          <div class="card">
            <div>
              <span class="category-badge">${escapeHtml(gig.category)}</span>
              <h3>${escapeHtml(gig.title)}</h3>
              <p style="color: var(--text-muted); font-size: 0.9rem;">${escapeHtml(gig.desc)}</p>
            </div>
            <div>
              <div class="price">${formatRupees(gig.rate)}</div>
              <button class="btn" onclick="bookGig(${gig.id})">Book Gig</button>
            </div>
          </div>
        `;
      });
    }

    function handlePostGig(e) {
      e.preventDefault();
      const newGig = {
        id: Date.now(),
        title: document.getElementById('gig-title').value,
        category: document.getElementById('gig-category').value,
        rate: Number(document.getElementById('gig-rate').value),
        desc: document.getElementById('gig-desc').value
      };
      
      gigs.push(newGig);
      saveData();
      document.getElementById('gig-form').reset();
      alert('Gig published successfully!');
      switchView('marketplace');
    }

    function bookGig(gigId) {
      const gig = gigs.find(g => g.id === gigId);
      if (!gig) return;

      const note = prompt(`Enter project requirements for "${gig.title}":`);
      if (note !== null && note.trim() !== '') {
        bookings.push({
          id: Date.now(),
          gigTitle: gig.title,
          rate: gig.rate,
          note: note,
          status: 'Pending'
        });
        saveData();
        alert('Booking request submitted!');
      }
    }

    function renderCreatorDashboard() {
      const container = document.getElementById('incoming-requests');
      container.innerHTML = '';

      if (bookings.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">No incoming requests.</p>';
        return;
      }

      bookings.forEach(booking => {
        container.innerHTML += `
          <div class="card">
            <div>
              <h3>${escapeHtml(booking.gigTitle)}</h3>
              <p><strong>Note:</strong> ${escapeHtml(booking.note)}</p>
              <p><strong>Rate:</strong> ${formatRupees(booking.rate)}</p>
              <p><strong>Status:</strong> <span class="status status-${booking.status}">${booking.status}</span></p>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
              ${booking.status === 'Pending' ? `
                <button class="btn btn-success" onclick="updateStatus(${booking.id}, 'Accepted')">Accept</button>
                <button class="btn btn-danger" onclick="updateStatus(${booking.id}, 'Declined')">Decline</button>
              ` : ''}
            </div>
          </div>
        `;
      });
    }

    function renderClientBookings() {
      const container = document.getElementById('client-bookings');
      container.innerHTML = '';

      if (bookings.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">You haven\'t requested any bookings yet.</p>';
        return;
      }

      bookings.forEach(b => {
        container.innerHTML += `
          <div class="card">
            <div>
              <h3>${escapeHtml(b.gigTitle)}</h3>
              <p><strong>Requirements:</strong> ${escapeHtml(b.note)}</p>
              <p><strong>Price:</strong> ${formatRupees(b.rate)}</p>
              <p><strong>Status:</strong> <span class="status status-${b.status}">${b.status}</span></p>
            </div>
            <div>
              ${b.status === 'Declined' ? `<button class="btn" onclick="switchView('marketplace')">Explore Other Gigs</button>` : ''}
            </div>
          </div>
        `;
      });
    }

    function updateStatus(bookingId, newStatus) {
      const booking = bookings.find(b => b.id === bookingId);
      if (booking) {
        booking.status = newStatus;
        saveData();
        renderCreatorDashboard();
      }
    }

    renderGigs();
  </script>
</body>
</html>
